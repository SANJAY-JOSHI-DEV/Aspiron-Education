<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker - Aspiron Education</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .back {
      display: inline-block;
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .addWeekBox {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .addWeekBox input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
    }
    .addWeekBox button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .weekCard {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .weekHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .weekHeader h3 { color: #93c5fd; font-size: 1.05rem; }
    .delBtn {
      background: rgba(248,113,113,0.15);
      border: 1px solid #f87171;
      color: #f87171;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .subjectBlock {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .subjectRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .chapterBlock {
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 6px;
    }
    .chapterRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .taskRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-top: 5px;
      font-size: 0.8rem;
      background: rgba(255,255,255,0.04);
      border-radius: 5px;
    }
    .taskRow.done span.taskLabel {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .doneTag {
      background: rgba(74,222,128,0.2);
      color: #4ade80;
      border: 1px solid #4ade80;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
    }
    .notDoneBtn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: #cbd5e1;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .addSubjectBox, .addChapterBox {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .addSubjectBox input, .addChapterBox input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 0.85rem;
    }
    .addSubjectBox button, .addChapterBox button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: rgba(96,165,250,0.3);
      border: 1px solid #60a5fa;
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .addRevBtn {
      margin-top: 6px;
      padding: 5px 10px;
      border: 1px dashed #93c5fd;
      background: transparent;
      color: #93c5fd;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    #message { text-align: center; font-size: 0.85rem; margin: 10px 0; color: #f87171; }
    .empty { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 30px; }
  </style>
</head>
<body>
  <a href="index.html" class="back">&larr; Back to Home</a>
  <h1>My Study Tracker</h1>

  <div class="addWeekBox">
    <input type="text" id="newWeekName" placeholder="e.g. Week 1">
    <button id="addWeekBtn">+ Add Week</button>
  </div>
  <p id="message"></p>

  <div id="weeksContainer"></div>
  <p class="empty" id="emptyMsg" style="display:none;">Koi week nahi bana abhi tak. Upar se add karo!</p>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBm1L2DJvTFOfyVBc0a7F89dCvhO8PlwC0",
      authDomain: "aspiron-education-demo.firebaseapp.com",
      projectId: "aspiron-education-demo",
      storageBucket: "aspiron-education-demo.firebasestorage.app",
      messagingSenderId: "620319488597",
      appId: "1:620319488597:web:822f9c1b2f2f78e0a6f2dc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let trackerData = { weeks: [] };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadTracker();
      } else {
        document.getElementById("message").textContent = "Pehle login karo tracker use karne ke liye";
      }
    });

    async function loadTracker() {
      const docRef = doc(db, "trackers", currentUser.uid);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        trackerData = docSnap.data();
        if (!trackerData.weeks) trackerData.weeks = [];
      }
      render();
    }

    async function saveTracker() {
      await setDoc(doc(db, "trackers", currentUser.uid), trackerData);
    }
    document.getElementById("addWeekBtn").addEventListener("click", () => {
      const input = document.getElementById("newWeekName");
      const name = input.value.trim();
      const message = document.getElementById("message");

      if (!name) {
        message.textContent = "Week ka naam likho";
        return;
      }
      if (!currentUser) {
        message.textContent = "Pehle login karo";
        return;
      }

      trackerData.weeks.push({
        id: Date.now().toString(),
        name: name,
        subjects: []
      });

      input.value = "";
      message.textContent = "";
      saveTracker();
      render();
    });

    function addSubject(weekId) {
      const input = document.getElementById("subjInput-" + weekId);
      const name = input.value.trim();
      if (!name) return;

      const week = trackerData.weeks.find(w => w.id === weekId);
      week.subjects.push({
        id: Date.now().toString(),
        name: name,
        expanded: false,
        chapters: []
      });

      saveTracker();
      render();
    }

    function deleteWeek(weekId) {
      trackerData.weeks = trackerData.weeks.filter(w => w.id !== weekId);
      saveTracker();
      render();
    }

    function deleteSubject(weekId, subjectId) {
      const week = trackerData.weeks.find(w => w.id === weekId);
      week.subjects = week.subjects.filter(s => s.id !== subjectId);
      saveTracker();
      render();
    }

    function toggleSubject(weekId, subjectId) {
      const week = trackerData.weeks.find(w => w.id === weekId);
      const subject = week.subjects.find(s => s.id === subjectId);
      subject.expanded = !subject.expanded;
      render();
    }
    function addChapter(weekId, subjectId) {
      const input = document.getElementById("chapInput-" + weekId + "-" + subjectId);
      const name = input.value.trim();
      if (!name) return;

      const week = trackerData.weeks.find(w => w.id === weekId);
      const subject = week.subjects.find(s => s.id === subjectId);
      subject.chapters.push({
        id: Date.now().toString(),
        name: name,
        expanded: false,
        lectureDone: false,
        dppDone: false,
        revisions: []
      });

      saveTracker();
      render();
    }

    function deleteChapter(weekId, subjectId, chapterId) {
      const week = trackerData.weeks.find(w => w.id === weekId);
      const subject = week.subjects.find(s => s.id === subjectId);
      subject.chapters = subject.chapters.filter(c => c.id !== chapterId);
      saveTracker();
      render();
    }

    function toggleChapter(weekId, subjectId, chapterId) {
      const week = trackerData.weeks.find(w => w.id === weekId);
      const subject = week.subjects.find(s => s.id === subjectId);
      const chapter = subject.chapters.find(c => c.id === chapterId);
      chapter.expanded = !chapter.expanded;
      render();
    }
    function toggleLecture(weekId, subjectId, chapterId) {
      const chapter = findChapter(weekId, subjectId, chapterId);
      chapter.lectureDone = !chapter.lectureDone;
      saveTracker();
      render();
    }

    function toggleDpp(weekId, subjectId, chapterId) {
      const chapter = findChapter(weekId, subjectId, chapterId);
      chapter.dppDone = !chapter.dppDone;
      saveTracker();
      render();
    }

    function addRevision(weekId, subjectId, chapterId) {
      const chapter = findChapter(weekId, subjectId, chapterId);
      const revNum = chapter.revisions.length + 1;
      chapter.revisions.push({
        id: Date.now().toString(),
        label: "Rev " + revNum,
        done: false
      });
      saveTracker();
      render();
    }

    function toggleRevision(weekId, subjectId, chapterId, revId) {
      const chapter = findChapter(weekId, subjectId, chapterId);
      const rev = chapter.revisions.find(r => r.id === revId);
      rev.done = !rev.done;
      saveTracker();
      render();
    }

    function findChapter(weekId, subjectId, chapterId) {
      const week = trackerData.weeks.find(w => w.id === weekId);
      const subject = week.subjects.find(s => s.id === subjectId);
      return subject.chapters.find(c => c.id === chapterId);
    }
    function render() {
      const container = document.getElementById("weeksContainer");
      const emptyMsg = document.getElementById("emptyMsg");
      container.innerHTML = "";

      if (trackerData.weeks.length === 0) {
        emptyMsg.style.display = "block";
        return;
      }
      emptyMsg.style.display = "none";

      trackerData.weeks.forEach(week => {
        const weekDiv = document.createElement("div");
        weekDiv.className = "weekCard";

        let subjectsHtml = "";
        week.subjects.forEach(subj => {
          let chaptersHtml = "";
          subj.chapters.forEach(chap => {
            const chapArrow = chap.expanded ? "▼" : "▶";

            let revisionsHtml = "";
            chap.revisions.forEach(rev => {
              revisionsHtml += `
                <div class="taskRow ${rev.done ? 'done' : ''}">
                  <span class="taskLabel">🔁 ${rev.label}</span>
                  ${rev.done
                    ? `<span class="doneTag" onclick="window.toggleRevision('${week.id}','${subj.id}','${chap.id}','${rev.id}')">Done ✅</span>`
                    : `<span class="notDoneBtn" onclick="window.toggleRevision('${week.id}','${subj.id}','${chap.id}','${rev.id}')">Mark Done</span>`
                  }
                </div>
              `;
            });

            const taskSection = chap.expanded ? `
              <div class="taskRow ${chap.lectureDone ? 'done' : ''}">
                <span class="taskLabel">🎥 Lecture</span>
                ${chap.lectureDone
                  ? `<span class="doneTag" onclick="window.toggleLecture('${week.id}','${subj.id}','${chap.id}')">Done ✅</span>`
                  : `<span class="notDoneBtn" onclick="window.toggleLecture('${week.id}','${subj.id}','${chap.id}')">Mark Done</span>`
                }
              </div>
              <div class="taskRow ${chap.dppDone ? 'done' : ''}">
                <span class="taskLabel">📝 DPP</span>
                ${chap.dppDone
                  ? `<span class="doneTag" onclick="window.toggleDpp('${week.id}','${subj.id}','${chap.id}')">Done ✅</span>`
                  : `<span class="notDoneBtn" onclick="window.toggleDpp('${week.id}','${subj.id}','${chap.id}')">Mark Done</span>`
                }
              </div>
              ${revisionsHtml}
              <button class="addRevBtn" onclick="window.addRevision('${week.id}','${subj.id}','${chap.id}')">+ Add Revision</button>
            ` : "";

            chaptersHtml += `
              <div class="chapterBlock">
                <div class="chapterRow" onclick="window.toggleChapter('${week.id}','${subj.id}','${chap.id}')">
                  <span>${chapArrow} 📖 ${chap.name}</span>
                  <button class="delBtn" onclick="event.stopPropagation(); window.deleteChapter('${week.id}','${subj.id}','${chap.id}')">Remove</button>
                </div>
                ${taskSection}
              </div>
            `;
          });

          const subjArrow = subj.expanded ? "▼" : "▶";
          const chapterSection = subj.expanded ? `
            ${chaptersHtml}
            <div class="addChapterBox">
              <input type="text" id="chapInput-${week.id}-${subj.id}" placeholder="Chapter name">
              <button onclick="window.addChapter('${week.id}','${subj.id}')">+ Add</button>
            </div>
          ` : "";

          subjectsHtml += `
            <div class="subjectBlock">
              <div class="subjectRow" onclick="window.toggleSubject('${week.id}','${subj.id}')">
                <span>${subjArrow} 📘 ${subj.name}</span>
                <button class="delBtn" onclick="event.stopPropagation(); window.deleteSubject('${week.id}','${subj.id}')">Remove</button>
              </div>
              ${chapterSection}
            </div>
          `;
        });

        weekDiv.innerHTML = `
          <div class="weekHeader">
            <h3>${week.name}</h3>
            <button class="delBtn" onclick="window.deleteWeek('${week.id}')">Delete Week</button>
          </div>
          ${subjectsHtml}
          <div class="addSubjectBox">
            <input type="text" id="subjInput-${week.id}" placeholder="Subject name (e.g. Physics)">
            <button onclick="window.addSubject('${week.id}')">+ Add</button>
          </div>
        `;

        container.appendChild(weekDiv);
      });
    }

    window.addSubject = addSubject;
    window.deleteWeek = deleteWeek;
    window.deleteSubject = deleteSubject;
    window.toggleSubject = toggleSubject;
    window.addChapter = addChapter;
    window.deleteChapter = deleteChapter;
    window.toggleChapter = toggleChapter;
    window.toggleLecture = toggleLecture;
    window.toggleDpp = toggleDpp;
    window.addRevision = addRevision;
    window.toggleRevision = toggleRevision;
  </script>
</body>
</html>
