<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup - Aspiron Education</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 25px 20px;
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    label {
      font-size: 0.85rem;
      color: #93c5fd;
      display: block;
      margin-bottom: 5px;
      margin-top: 12px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 0.95rem;
    }
    input::placeholder { color: #94a3b8; }
    select option { background: #24243e; color: #fff; }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 20px;
      cursor: pointer;
    }
    #message {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Complete Your Profile</h2>

    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Your name">

    <label>Mobile Number</label>
    <input type="tel" id="mobile" placeholder="10-digit mobile number">

    <label>City</label>
    <input type="text" id="city" placeholder="Your city">

    <label>Which Exam?</label>
    <select id="examType">
      <option value="">Select exam</option>
      <option value="NEET">NEET</option>
      <option value="JEE">JEE</option>
      <option value="Other">Other</option>
    </select>

    <div id="customExamBox" style="display:none;">
      <label>Exam Name</label>
      <input type="text" id="customExamName" placeholder="e.g. CUET, State Exam">
    </div>

    <button id="saveBtn">Save & Continue</button>
    <p id="message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBm1L2DJvTFOfyVBc0a7F89dCvhO8PlwC0",
      authDomain: "aspiron-education-demo.firebaseapp.com",
      projectId: "aspiron-education-demo",
      storageBucket: "aspiron-education-demo.firebasestorage.app",
      messagingSenderId: "620319488597",
      appId: "1:620319488597:web:822f9c1b2f2f78e0a6f2dc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
      } else {
        document.getElementById("message").textContent = "Pehle login karo";
        document.getElementById("message").style.color = "#f87171";
      }
    });

    document.getElementById("examType").addEventListener("change", (e) => {
      document.getElementById("customExamBox").style.display =
        e.target.value === "Other" ? "block" : "none";
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const message = document.getElementById("message");
      const fullName = document.getElementById("fullName").value;
      const mobile = document.getElementById("mobile").value;
      const city = document.getElementById("city").value;
      const examType = document.getElementById("examType").value;
      const customExamName = document.getElementById("customExamName").value;

      if (!fullName || !mobile || !city || !examType) {
        message.style.color = "#f87171";
        message.textContent = "Sabhi fields bharo";
        return;
      }
      if (examType === "Other" && !customExamName) {
        message.style.color = "#f87171";
        message.textContent = "Exam ka naam likho";
        return;
      }
      if (!currentUser) {
        message.style.color = "#f87171";
        message.textContent = "Pehle login karo";
        return;
      }

      const finalExamName = examType === "Other" ? customExamName : examType;

      try {
        await setDoc(doc(db, "profiles", currentUser.uid), {
          fullName: fullName,
          mobile: mobile,
          city: city,
          examType: finalExamName
        });

        message.style.color = "#4ade80";
        message.textContent = "Profile saved! Redirecting...";
        setTimeout(() => window.location.href = "countdown.html", 1000);
      } catch (error) {
        message.style.color = "#f87171";
        message.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
